          <p>Extended to a full paper → <b>published in the Convergence Security Journal (KCI), vol. 26, no. 4, pp. 277–285, 2026</b> · DOI <a href="https://doi.org/10.33778/kcsa.2026.26.4.277" target="_blank" rel="noopener">10.33778/kcsa.2026.26.4.277</a> · published as "MECA: A Medical eBPF Compliance Architecture for Access-Log Visibility in Cloud-Based EMR Systems"</p>
          <h4>Problem</h4>
          <p>Korea's revised medical law permits cloud-hosted EMRs, but native monitoring on AWS, Azure, and GCP is limited to 5-tuple metadata. As a result, only <b>2 of the 5 ISMS-P §2.9.4 access-log items</b> (timestamp, source) are captured — a 40% coverage rate.</p>
          <h4>Proposed: MECA</h4>
          <p>A cloud-agnostic compliance-logging framework deployed as an in-VM agent.</p>
          <ul>
            <li><b>eBPF SSL uprobes</b> attach to OpenSSL <code>SSL_read</code> / <code>SSL_write</code> to capture plaintext payloads without exposing TLS keys — extracting account ID, data subject, and performed action.</li>

            <li>Both paths are correlated via <b>eBPF Maps</b> and emitted in the ISMS-P schema.</li>
            <li><b>In-kernel PII masking</b> — sensitive fields (RRN, passwords, phone numbers) are replaced with <code>*</code> at capture time, statically unrolled to satisfy the eBPF verifier.</li>
          </ul>

          <ul>
            <li>AWS EC2 + OpenEMR 7.0.2, Synthea synthetic patients, 1,000 transactions.</li>

            <li>PII masking precision &amp; recall: <b>100% / 100%</b>.</li>

      body: {
        kr: `
          <h4>문제</h4>
          <p>ICS를 감시하는 NIDS는 판정에 앞서 DNP3 프레임을 스스로 재조립한다. 그 방식이 명령을 처리하는 엔드포인트와 다르면 <b>NIDS가 인식한 명령과 실제로 처리된 명령이 달라진다</b>. 엔드포인트가 폐기한 명령에 NIDS가 경보하면 오탐, 엔드포인트가 처리한 명령에 경보하지 않으면 미탐이다.</p>
          <h4>제안 — 엔드포인트 정규화기</h4>
          <p>마스터와 엔드포인트 사이 경로에서 엔드포인트의 수신 규칙대로 트래픽을 걸러 다시 만든다. <b>링크 검사 · 전송 재조립 · 재전송</b> 세 단계로 구성되며, 링크 검사에서는 엔드포인트의 허용 주소 목록을 적용한다. 검사를 통과하지 못한 부분만 차단하고 그 사유를 기록하며, 같은 세션의 정상 명령은 그대로 전달한다.</p>

        en: `
          <h4>Problem</h4>
          <p>An ICS NIDS reassembles DNP3 frames itself before it decides. When its method differs from the endpoint that executes the command, <b>the command the NIDS recognizes and the command actually processed diverge</b>. A false positive is an alert on a command the endpoint discarded; a false negative is silence on a command the endpoint processed.</p>
          <h4>Proposed — Endpoint-Specific Normalizer</h4>
          <p>Placed on the path between master and endpoint, it inspects and rebuilds traffic by the endpoint's own receive rules in three stages: <b>link check · transport reassembly · retransmission</b>. The link check applies the endpoint's allowed-address list. Only the parts that fail are blocked, with the reason logged; legitimate commands in the same session pass through.</p>
          <h4>Evaluation</h4>
          <p>Identical IEEE 1815 frames were injected into <b>Snort · Zeek · Suricata</b> and <b>opendnp3</b> and the verdicts compared, with Rust dnp3 as a cross-check.</p>
          <ul>
            <li><b>9 divergences</b> before normalization (7 false positives, 2 false negatives), seen on all three NIDS. 5 of the false positives trace to unverified link source addresses; both false negatives to transport-layer reassembly differences</li>
            <li>NIDS tuning left 8 and specification-only normalization left 3, while the endpoint-specific normalizer left <b>0</b></li>
            <li>On 40 mixed sessions with a legitimate command after a mutated fragment, session-level blocking lost 30 legitimate commands; the normalizer delivered all of them</li>
            <li>About 6 µs per session, excluding I/O</li>
          </ul>
          <p>Only a software endpoint and self-generated benign traffic were used; inline latency and throughput were not evaluated.</p>
          <h4>Status · Role</h4>
          <p><b>First author</b> — experiment design, implementation, and writing · short paper accepted to <b>KSC 2026</b> (KIISE Korea Software Congress), Nov 2026 · poster presentation in Gyeongju, Dec 2026</p>
          <h4>Stack</h4>
          <div class="modal-stack"><span class="tag">DNP3 / IEEE 1815</span><span class="tag">Snort 3</span><span class="tag">Zeek</span><span class="tag">Suricata</span><span class="tag">opendnp3</span><span class="tag">Rust dnp3</span><span class="tag">scapy</span><span class="tag">Python</span></div>
        `
      }
